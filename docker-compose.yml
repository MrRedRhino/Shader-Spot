services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: shader_spot
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    secrets:
      - postgres-password

secrets:
  postgres-password:
    file: secrets/postgres-password
